name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests (unit + integration)
        run: bash mvnw -B verify

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/main/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: src/main/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npx eslint .

      # --coverage rather than a bare run: the thresholds in vitest.config.ts fail the build when
      # coverage drops, which is the whole point of measuring it. See that file for how they are set.
      - name: Run tests
        run: npx vitest run --coverage

      # Two audits, because they answer different questions and deserve different verdicts.
      # What ships is the one that can fail the build: a vulnerability in a runtime dependency
      # reaches users. Everything flagged today is build tooling — vitest, browserslist — which
      # never leaves the machine, so it is reported as a warning instead of blocking delivery for
      # something nobody can exploit. Both are at zero as of this commit.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit build tooling (informational)
        run: npm audit --audit-level=high
        continue-on-error: true

  compose:
    name: Production compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t nido:ci .

      # What a newcomer does: the compose file, nothing else. This is where such installations break —
      # file ownership in the secret volumes, start order — and no other test starts this stack.
      - name: Start the stack
        working-directory: deploy
        env:
          NIDO_IMAGE: nido:ci
        run: docker compose up -d

      - name: The setup screen is waiting, with its code in the logs
        working-directory: deploy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/setup/status > status.json; then break; fi
            sleep 5
          done
          cat status.json
          grep -q '"required":true' status.json
          docker compose logs nido | grep -q 'Setup code:'

      - name: Logs
        if: always()
        working-directory: deploy
        run: docker compose logs

      - name: Stop
        if: always()
        working-directory: deploy
        run: docker compose down -v
