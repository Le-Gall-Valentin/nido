name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    # Pinned rather than ubuntu-latest, here and in every job: the runner image changes when a pull
    # request says so and its CI has passed on it, not on GitHub's schedule in the middle of a release.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: ./.github/actions/docker-hub-mirror

      - name: Run backend tests (unit + integration)
        run: bash mvnw -B verify

  frontend:
    name: Frontend tests
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: src/main/frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: src/main/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npx eslint .

      # --coverage rather than a bare run: the thresholds in vitest.config.ts fail the build when
      # coverage drops, which is the whole point of measuring it. See that file for how they are set.
      - name: Run tests
        run: npx vitest run --coverage

      # Two audits, because they answer different questions and deserve different verdicts.
      # What ships is the one that can fail the build: a vulnerability in a runtime dependency
      # reaches users. Build tooling never leaves the machine, so a finding there becomes a warning
      # on the run instead of blocking delivery for something nobody can exploit.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      # A tooling advisory nobody can fix yet is accepted here, by id and with its reason, rather
      # than left to turn every run red until the signal stops being read:
      # - GHSA-vfj7-8cjw-p6xm, braces: no patched release exists (every version up to 3.0.3). It
      #   reaches us only through eslint-plugin-boundaries → micromatch, which expands the globs
      #   written in eslint.config.js — our own patterns, never a stranger's input.
      # An accepted advisory that stops being reported is flagged, so the list cannot outlive its reasons.
      - name: Audit build tooling (informational)
        env:
          ACCEPTED: GHSA-vfj7-8cjw-p6xm
        run: |
          npm audit --json > audit.json || true
          jq -r --arg accepted "$ACCEPTED" '
            ($accepted | split(" ")) as $accepted
            | [.vulnerabilities[].via[] | objects | select(.severity == "high" or .severity == "critical")]
            | unique_by(.url)
            | map(. + {id: (.url | split("/") | last)}) as $found
            | ($found[] | if (.id | IN($accepted[]))
                then "Accepted: \(.name) — \(.title) (\(.url))"
                else "::warning title=npm audit (build tooling)::\(.name) — \(.title) (\(.severity), \(.url))"
                end),
              ($accepted[] | select(IN($found[].id) | not)
                | "::warning title=npm audit (build tooling)::\(.) is accepted in ci.yml but no longer reported: remove it from the list")
          ' audit.json
        continue-on-error: true

  compose:
    name: Production compose
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/docker-hub-mirror

      - name: Build the image
        run: docker build -t nido:ci .

      # What a newcomer does: the compose file, nothing else. This is where such installations break —
      # file ownership in the secret volumes, start order — and no other test starts this stack.
      - name: Start the stack
        working-directory: deploy
        env:
          NIDO_IMAGE: nido:ci
        run: docker compose up -d

      - name: The setup screen is waiting, with its code in the logs
        working-directory: deploy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/setup/status > status.json; then break; fi
            sleep 5
          done
          cat status.json
          grep -q '"required":true' status.json
          docker compose logs nido | grep -q 'Setup code:'

      - name: Logs
        if: always()
        working-directory: deploy
        run: docker compose logs

      - name: Stop
        if: always()
        working-directory: deploy
        run: docker compose down -v
