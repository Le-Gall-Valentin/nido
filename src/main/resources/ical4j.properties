# ical4j reads this file from the classpath at start-up.
# Never fetch a time zone definition (a TZURL) over the network: an import or a followed calendar would otherwise make
# the server call an address of the file's choosing.
net.fortuna.ical4j.timezone.update.enabled=false
# ical4j's own default, pinned: the other cache it offers needs the JCache API, which nido does not ship.
net.fortuna.ical4j.timezone.cache.impl=net.fortuna.ical4j.util.MapTimeZoneCache
# Files written by Outlook, Google and others bend the RFC: read them as their authors meant.
ical4j.unfolding.relaxed=true
ical4j.parsing.relaxed=true
ical4j.validation.relaxed=true
ical4j.compatibility.outlook=true
