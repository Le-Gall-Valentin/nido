<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mail(#{subject(${mail.actorName}, ${mail.accountName})}, #{preheader}, ~{::content})}">
<body>
<th:block th:fragment="content">
  <h1 th:replace="~{components :: heading(#{heading})}"></h1>
  <p th:replace="~{components :: paragraph(#{greeting(${mail.username})})}"></p>
  <p th:replace="~{components :: paragraph(#{body(${mail.actorName}, ${mail.accountName})})}"></p>
  <table th:replace="~{components :: button(${appUrl + mail.usersPath.value}, #{action})}"></table>
  <p th:replace="~{components :: fallbackLink(${appUrl + mail.usersPath.value})}"></p>
  <p th:replace="~{notifications/manage :: manage}"></p>
</th:block>
</body>
</html>
