<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mail(#{subject(${mail.actorName}, ${mail.goal.name})}, #{preheader(${mail.spaceName})}, ~{::content})}">
<body>
<th:block th:fragment="content">
  <h1 th:replace="~{components :: heading(#{heading})}"></h1>
  <p th:replace="~{components :: paragraph(#{greeting(${mail.username})})}"></p>
  <p th:replace="~{components :: paragraph(#{body(${mail.actorName}, ${mail.goal.name}, ${mail.spaceName})})}"></p>
  <th:block th:replace="~{finance/parts :: goal(${mail.goal})}"></th:block>
  <th:block th:replace="~{finance/parts :: savedByMember(${mail.saved}, ${mail.savedByMember})}"></th:block>
  <table th:replace="~{components :: button(${appUrl + mail.financePath.value}, #{action})}"></table>
  <p th:replace="~{components :: fallbackLink(${appUrl + mail.financePath.value})}"></p>
  <p th:replace="~{notifications/manage :: manage}"></p>
</th:block>
</body>
</html>
