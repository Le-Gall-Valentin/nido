<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mail(#{${'subject.' + mail.involvement}(${mail.actorName}, ${mail.label()})}, #{preheader(${mail.spaceName})}, ~{::content})}">
<body>
<th:block th:fragment="content">
  <h1 th:replace="~{components :: heading(#{heading})}"></h1>
  <p th:replace="~{components :: paragraph(#{greeting(${mail.username})})}"></p>
  <p th:replace="~{components :: paragraph(#{${'body.' + mail.involvement}(${mail.actorName}, ${mail.spaceName})})}"></p>
  <th:block th:if="${mail.involvement.name() == 'CHANGED'}">
    <th:block th:replace="~{finance/parts :: operationChange(${mail.before}, ${mail.after}, ${mail.readerId})}"></th:block>
  </th:block>
  <th:block th:if="${mail.involvement.name() == 'ADDED'}">
    <th:block th:replace="~{finance/parts :: operation(${mail.after}, ${mail.readerId})}"></th:block>
  </th:block>
  <th:block th:if="${mail.involvement.name() == 'REMOVED'}">
    <th:block th:replace="~{finance/parts :: operation(${mail.before}, ${mail.readerId})}"></th:block>
  </th:block>
  <table th:replace="~{components :: button(${appUrl + mail.financePath.value}, #{action})}"></table>
  <p th:replace="~{components :: fallbackLink(${appUrl + mail.financePath.value})}"></p>
  <p th:replace="~{notifications/manage :: manage}"></p>
</th:block>
</body>
</html>
