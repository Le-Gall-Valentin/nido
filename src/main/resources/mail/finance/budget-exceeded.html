<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mail(#{subject(${mail.alert.categoryLabel}, ${mail.alert.percent()})}, #{preheader(${mail.spaceName})}, ~{::content})}">
<body>
<th:block th:fragment="content">
  <h1 th:replace="~{components :: heading(#{heading})}"></h1>
  <p th:replace="~{components :: paragraph(#{greeting(${mail.username})})}"></p>
  <p th:replace="~{components :: paragraph(#{body(${mail.spaceName}, ${mail.alert.causeLabel}, ${format.amount(mail.alert.causeAmount)}, ${mail.actorName}, ${mail.alert.categoryLabel}, ${format.month(mail.alert.month)}, ${format.amount(mail.alert.spent)}, ${format.amount(mail.alert.limit)}, ${format.amount(mail.alert.overrun())})})}"></p>
  <table th:replace="~{components :: button(${appUrl + mail.financePath.value}, #{action})}"></table>
  <p th:replace="~{components :: fallbackLink(${appUrl + mail.financePath.value})}"></p>
  <p th:replace="~{notifications/manage :: manage}"></p>
</th:block>
</body>
</html>
