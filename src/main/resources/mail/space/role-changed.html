<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mail(#{subject(${mail.spaceName})}, #{preheader(${mail.spaceName})}, ~{::content})}">
<body>
<th:block th:fragment="content">
  <h1 th:replace="~{components :: heading(#{heading})}"></h1>
  <p th:replace="~{components :: paragraph(#{greeting(${mail.username})})}"></p>
  <th:block th:with="previous=#{${'role.' + mail.previousRole}}, next=#{${'role.' + mail.newRole}}">
    <p th:replace="~{components :: paragraph(#{body(${mail.actorName}, ${mail.spaceName}, ${previous}, ${next})})}"></p>
  </th:block>
  <table th:replace="~{components :: button(${appUrl + mail.membersPath.value}, #{action})}"></table>
  <p th:replace="~{components :: fallbackLink(${appUrl + mail.membersPath.value})}"></p>
  <p th:replace="~{notifications/manage :: manage}"></p>
</th:block>
</body>
</html>
