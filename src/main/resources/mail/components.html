<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<h1 th:fragment="heading(text)" data-text-line th:text="${text}"
    style="margin:0 0 14px;font-family:'Bricolage Grotesque','Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:23px;line-height:1.15;font-weight:600;letter-spacing:-0.02em;color:#2c2a26;">Heading</h1>

<p th:fragment="paragraph(text)" data-text-line th:text="${text}"
   style="margin:0 0 14px;font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14.5px;line-height:1.6;color:#4a463f;">Paragraph</p>

<!-- A "bulletproof" button: the colour sits on the table cell, which Outlook paints, not on the link. -->
<table th:fragment="button(href, label)" role="presentation" cellpadding="0" cellspacing="0" border="0"
       style="margin:20px 0 18px;">
  <tr>
    <td bgcolor="#5c7a58" style="background-color:#5c7a58;border-radius:11px;">
      <a data-text-line th:href="${href}" th:text="${label}" href="#"
         style="display:inline-block;padding:12px 20px;font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:600;line-height:1.2;color:#ffffff;text-decoration:none;border-radius:11px;">Label</a>
    </td>
  </tr>
</table>

<table th:fragment="note(text, tone)"
       th:assert="${tone == 'info' or tone == 'warning'}"
       th:with="background=${tone == 'warning' ? '#f8e5e1' : '#eef2ec'}, foreground=${tone == 'warning' ? '#a3463a' : '#3f5b3b'}"
       role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:18px 0;">
  <tr>
    <td th:attr="bgcolor=${background}"
        style="border-radius:10px;padding:10px 14px;font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.5;"
        th:styleappend="${'background-color:' + background + ';color:' + foreground + ';'}">
      <span data-text-line th:text="${text}">Note</span>
    </td>
  </tr>
</table>

<p th:fragment="fallbackLink(href)"
   style="margin:0 0 14px;font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.55;color:#6f6a61;">
  <span data-text-line th:text="#{fallback.intro}">Intro</span><br>
  <a data-text-line th:href="${href}" th:text="${href}" href="#" style="color:#5c7a58;word-break:break-all;">https://</a>
</p>

<p th:fragment="small(text)" data-text-line th:text="${text}"
   style="margin:0 0 14px;font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.55;color:#6f6a61;">Small</p>

</body>
</html>
