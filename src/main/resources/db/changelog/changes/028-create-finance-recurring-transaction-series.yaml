databaseChangeLog:
  - changeSet:
      id: 028-create-finance-recurring-transaction-series
      author: nido
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: finance_recurring_transaction_series
      changes:
        - createTable:
            tableName: finance_recurring_transaction_series
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: space_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: label_encrypted
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: amount_encrypted
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: payer_id
                  type: UUID
              - column:
                  name: interval_type
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: interval_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: anchor_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
              - column:
                  name: last_materialized_date
                  type: DATE
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            sql: ALTER TABLE finance_recurring_transaction_series ADD CONSTRAINT chk_finance_recurring_series_type CHECK (type IN ('EXPENSE', 'INCOME'))
            splitStatements: false
        - sql:
            sql: ALTER TABLE finance_recurring_transaction_series ADD CONSTRAINT chk_finance_recurring_series_interval_type CHECK (interval_type IN ('DAILY', 'WEEKLY', 'MONTHLY'))
            splitStatements: false
        - addForeignKeyConstraint:
            baseTableName: finance_recurring_transaction_series
            baseColumnNames: space_id
            referencedTableName: spaces
            referencedColumnNames: id
            constraintName: fk_finance_recurring_series_space
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: finance_recurring_transaction_series
            baseColumnNames: category_id
            referencedTableName: finance_categories
            referencedColumnNames: id
            constraintName: fk_finance_recurring_series_category
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: finance_recurring_transaction_series
            baseColumnNames: payer_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_finance_recurring_series_payer
            onDelete: SET NULL
      rollback:
        - dropTable:
            tableName: finance_recurring_transaction_series
            cascadeConstraints: true
