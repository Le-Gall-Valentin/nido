databaseChangeLog:
  - changeSet:
      id: 054-personal-space-owner-takes-part
      author: nido
      comment: >
        In a personal space its owner takes part in every event and series, whatever a request
        said: the application now settles the participants of every write that way. Events and
        series written before that rule may carry nobody; this gives them their owner — the one
        member of a personal space — and nobody else, since nobody else could ever have been added.
      changes:
        - sql:
            sql: >
              INSERT INTO calendar_event_participants (event_id, user_id)
              SELECT e.id, m.user_id
              FROM calendar_events e
              JOIN spaces s ON s.id = e.space_id AND s.type = 'PERSONAL'
              JOIN space_members m ON m.space_id = s.id
              ON CONFLICT (event_id, user_id) DO NOTHING
        - sql:
            sql: >
              INSERT INTO calendar_recurring_event_series_participants (series_id, user_id)
              SELECT r.id, m.user_id
              FROM calendar_recurring_event_series r
              JOIN spaces s ON s.id = r.space_id AND s.type = 'PERSONAL'
              JOIN space_members m ON m.space_id = s.id
              ON CONFLICT (series_id, user_id) DO NOTHING
      # Nothing to undo: the rows it added cannot be told from the ones written since, and the app
      # now requires every one of them. Rolling the schema back leaves them in place, harmlessly.
      rollback:
        empty
