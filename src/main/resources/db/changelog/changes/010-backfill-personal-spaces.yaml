databaseChangeLog:
  - changeSet:
      id: 010-backfill-personal-spaces
      author: nido
      comment: "Gives every pre-existing account the personal space the application now assumes."
      changes:
        - sql:
            splitStatements: false
            sql: >
              INSERT INTO spaces (id, type, name, accent, glyph, personal_owner_id, created_by, created_at)
              SELECT gen_random_uuid(), 'PERSONAL', 'Perso', '#8a7d6b', '👤', u.id, u.id, now()
              FROM users u
              WHERE u.is_deleted = false
                AND NOT EXISTS (SELECT 1 FROM spaces s WHERE s.personal_owner_id = u.id)
        - sql:
            splitStatements: false
            sql: >
              INSERT INTO space_members (id, space_id, user_id, role, joined_at)
              SELECT gen_random_uuid(), s.id, s.personal_owner_id, 'OWNER', now()
              FROM spaces s
              WHERE s.type = 'PERSONAL'
                AND NOT EXISTS (
                  SELECT 1 FROM space_members m WHERE m.space_id = s.id AND m.user_id = s.personal_owner_id
                )
      rollback:
        - sql:
            splitStatements: false
            sql: DELETE FROM space_members WHERE space_id IN (SELECT id FROM spaces WHERE type = 'PERSONAL')
        - sql:
            splitStatements: false
            sql: DELETE FROM spaces WHERE type = 'PERSONAL'
