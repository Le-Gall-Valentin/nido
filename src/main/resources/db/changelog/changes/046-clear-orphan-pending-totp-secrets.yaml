databaseChangeLog:
  - changeSet:
      id: 046-clear-orphan-pending-totp-secrets
      author: nido
      comment: >
        An enrolment that was started but never confirmed now lives in Redis under a TTL, not in
        this column. Any secret sitting here on a row where TOTP is not enabled is left over from
        the previous design: nothing reads it any more, and it is an unconfirmed credential with no
        expiry, which is exactly what moving the enrolment out was meant to stop. Rows with TOTP
        enabled are untouched — that secret is the live authenticator.
      changes:
        - update:
            tableName: user_totp
            columns:
              - column:
                  name: totp_secret
                  value: null
            where: totp_enabled = false AND totp_secret IS NOT NULL
