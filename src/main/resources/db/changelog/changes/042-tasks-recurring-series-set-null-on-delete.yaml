databaseChangeLog:
  - changeSet:
      id: 042-tasks-recurring-series-set-null-on-delete
      author: nido
      preConditions:
        - onFail: MARK_RAN
        # Existence alone can't distinguish "still the original CASCADE rule" from
        # "already SET NULL" — the constraint is present under this name either way,
        # only its confdeltype changes — so check that directly against pg_constraint.
        - sqlCheck:
            expectedResult: 0
            sql: SELECT count(*) FROM pg_constraint WHERE conname = 'fk_tasks_recurring_series' AND confdeltype = 'n'
      changes:
        # Deleting a recurring series should stop future occurrences without erasing
        # the tasks it already produced — detach them from the series instead of
        # cascading their deletion.
        - dropForeignKeyConstraint:
            baseTableName: tasks
            constraintName: fk_tasks_recurring_series
        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: recurring_series_id
            constraintName: fk_tasks_recurring_series
            referencedTableName: recurring_task_series
            referencedColumnNames: id
            onDelete: SET NULL
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: tasks
            constraintName: fk_tasks_recurring_series
        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: recurring_series_id
            constraintName: fk_tasks_recurring_series
            referencedTableName: recurring_task_series
            referencedColumnNames: id
            onDelete: CASCADE
