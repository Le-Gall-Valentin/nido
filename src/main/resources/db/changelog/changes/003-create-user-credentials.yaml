databaseChangeLog:
  - changeSet:
      id: 003-create-user-credentials
      author: synapsys
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: user_credentials
      changes:
        - createTable:
            tableName: user_credentials
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_user_credentials_user
                    references: users(id)
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: user_credentials