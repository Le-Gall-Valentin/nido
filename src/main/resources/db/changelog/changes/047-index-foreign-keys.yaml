databaseChangeLog:
  # Postgres indexes the referencing side of a foreign key for nobody: declaring one buys the
  # integrity check and none of the lookups it needs. Every DELETE on a parent row therefore scans
  # the whole child table to find out whether anything still points at it — and the parents here
  # are deleted by ordinary use: a category the user removes, an account erased under GDPR, a
  # recipe dropped from the book. Nineteen of them had no usable index.
  #
  # One changeSet per index, on purpose. A single changeSet guarded on one index name marks itself
  # executed the moment that one exists and silently skips the rest — the trap this project already
  # walked into once, in migration 044.
  - changeSet:
      id: 047-index-finance_budgets-category_id
      author: nido
      changes:
        - createIndex:
            tableName: finance_budgets
            indexName: idx_finance_budgets_category_id
            columns:
              - column:
                  name: category_id

  - changeSet:
