databaseChangeLog:
  - changeSet:
      id: 053-create-calendar-recurring-event-series-participants
      author: nido
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: calendar_recurring_event_series_participants
      changes:
        - createTable:
            tableName: calendar_recurring_event_series_participants
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: series_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: calendar_recurring_event_series_participants
            columnNames: series_id, user_id
            constraintName: uq_cresp_owner_user
        - createIndex:
            tableName: calendar_recurring_event_series_participants
            indexName: idx_cresp_series_id
            columns:
              - column:
                  name: series_id
        - createIndex:
            tableName: calendar_recurring_event_series_participants
            indexName: idx_cresp_user_id
            columns:
              - column:
                  name: user_id
        - addForeignKeyConstraint:
            baseTableName: calendar_recurring_event_series_participants
            baseColumnNames: series_id
            referencedTableName: calendar_recurring_event_series
            referencedColumnNames: id
            constraintName: fk_cresp_owner
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: calendar_recurring_event_series_participants
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_cresp_user
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: calendar_recurring_event_series_participants
            cascadeConstraints: true
