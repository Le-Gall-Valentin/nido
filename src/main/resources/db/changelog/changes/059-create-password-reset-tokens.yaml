databaseChangeLog:
  - changeSet:
      id: 059-create-password-reset-tokens
      author: nido
      comment: >
        One-time links to choose a new password. Only the SHA-256 of a token is kept, like refresh
        tokens: a read of this table gives nothing that works. In Postgres rather than Redis on
        purpose — Postgres already holds the password hashes, so it adds no way in; Redis is the least
        protected store, and a token there would make write access to it enough to take any account.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: password_reset_tokens
      changes:
        - createTable:
            tableName: password_reset_tokens
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_password_reset_tokens_token_hash
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - createIndex:
            tableName: password_reset_tokens
            indexName: idx_password_reset_tokens_user_id
            columns:
              - column:
                  name: user_id
        - addForeignKeyConstraint:
            baseTableName: password_reset_tokens
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_password_reset_tokens_user
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: password_reset_tokens
            cascadeConstraints: true
