databaseChangeLog:
  - changeSet:
      id: 074-add-instance-legacy-formats-closed
      author: nido
      comment: >
        When a start brought every encrypted value to the format of 0.16.0. Until then the start converts what earlier
        versions wrote; from then on a value of an earlier format can only have been written by someone with access to
        the database — a ciphertext from an old backup — and is refused, never converted into the value of its row.
        Empty on an upgrade: the start that leaves nothing to convert sets it — the first one of 0.16.0, or for a 0.13
        database the next, once 068 dropped the columns in clear. Kept in the database, it guards against a value put
        back there, not against someone who can also empty it: the next start would convert again.
      changes:
        - addColumn:
            tableName: instance
            columns:
              - column:
                  name: legacy_formats_closed_at
                  type: TIMESTAMP WITH TIME ZONE
      rollback:
        - dropColumn:
            tableName: instance
            columnName: legacy_formats_closed_at
