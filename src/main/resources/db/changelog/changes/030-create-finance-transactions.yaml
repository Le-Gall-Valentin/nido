databaseChangeLog:
  - changeSet:
      id: 030-create-finance-transactions
      author: nido
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: finance_transactions
      changes:
        - createTable:
            tableName: finance_transactions
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: space_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: label_encrypted
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: amount_encrypted
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: payer_id
                  type: UUID
              - column:
                  name: recurring_series_id
                  type: UUID
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            sql: ALTER TABLE finance_transactions ADD CONSTRAINT chk_finance_transactions_type CHECK (type IN ('EXPENSE', 'INCOME'))
            splitStatements: false
        - createIndex:
            tableName: finance_transactions
            indexName: idx_finance_transactions_space_id_date
            columns:
              - column:
                  name: space_id
              - column:
                  name: date
        - addForeignKeyConstraint:
            baseTableName: finance_transactions
            baseColumnNames: space_id
            referencedTableName: spaces
            referencedColumnNames: id
            constraintName: fk_finance_transactions_space
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: finance_transactions
            baseColumnNames: category_id
            referencedTableName: finance_categories
            referencedColumnNames: id
            constraintName: fk_finance_transactions_category
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: finance_transactions
            baseColumnNames: payer_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_finance_transactions_payer
            onDelete: SET NULL
        - addForeignKeyConstraint:
            baseTableName: finance_transactions
            baseColumnNames: recurring_series_id
            referencedTableName: finance_recurring_transaction_series
            referencedColumnNames: id
            constraintName: fk_finance_transactions_recurring_series
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: finance_transactions
            cascadeConstraints: true
