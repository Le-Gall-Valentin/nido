databaseChangeLog:
  - changeSet:
      id: 025-add-spaces-encryption-salt
      author: nido
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: spaces
                columnName: encryption_salt
      changes:
        - addColumn:
            tableName: spaces
            columns:
              - column:
                  name: encryption_salt
                  type: VARCHAR(32)
        - sql:
            sql: UPDATE spaces SET encryption_salt = md5(random()::text || clock_timestamp()::text) WHERE encryption_salt IS NULL
            splitStatements: false
        - addNotNullConstraint:
            tableName: spaces
            columnName: encryption_salt
            columnDataType: VARCHAR(32)
      rollback:
        - dropColumn:
            tableName: spaces
            columnName: encryption_salt
