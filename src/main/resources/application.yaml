spring:
  application:
    name: nido
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      url: ${NIDO_REDIS_URL:redis://localhost:6379}

  datasource:
    url: ${NIDO_DB_URL}
    username: ${NIDO_DB_USER}
    password: ${NIDO_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

NIDO:
  jwt:
    secret: ${NIDO_JWT_SECRET}
    expiry-minutes: ${NIDO_JWT_EXPIRY_MINUTES:15}
  refresh-token:
    expiry-days: ${NIDO_REFRESH_TOKEN_EXPIRY_DAYS:30}
    purge-cron: ${NIDO_REFRESH_TOKEN_PURGE_CRON:0 0 3 * * *}
  cookie:
    secure: ${NIDO_COOKIE_SECURE:true}
  seed:
    username: ${NIDO_SEED_USERNAME}
    email: ${NIDO_SEED_EMAIL}
    password: ${NIDO_SEED_PASSWORD}
  cors:
    allowed-origins: ${NIDO_CORS_ALLOWED_ORIGINS:}
  encryption:
    secret: ${NIDO_ENCRYPTION_SECRET}
