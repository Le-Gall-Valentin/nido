spring:
  application:
    name: boilerplate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      url: ${BOILERPLATE_REDIS_URL:redis://localhost:6379}

  datasource:
    url: ${BOILERPLATE_DB_URL}
    username: ${BOILERPLATE_DB_USER}
    password: ${BOILERPLATE_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

boilerplate:
  jwt:
    secret: ${BOILERPLATE_JWT_SECRET}
    expiry-minutes: ${BOILERPLATE_JWT_EXPIRY_MINUTES:15}
  refresh-token:
    expiry-days: ${BOILERPLATE_REFRESH_TOKEN_EXPIRY_DAYS:30}
    purge-cron: ${BOILERPLATE_REFRESH_TOKEN_PURGE_CRON:0 0 3 * * *}
  cookie:
    secure: ${BOILERPLATE_COOKIE_SECURE:true}
  seed:
    username: ${BOILERPLATE_SEED_USERNAME}
    email: ${BOILERPLATE_SEED_EMAIL}
    password: ${BOILERPLATE_SEED_PASSWORD}
  cors:
    allowed-origins: ${BOILERPLATE_CORS_ALLOWED_ORIGINS:}
  encryption:
    secret: ${BOILERPLATE_ENCRYPTION_SECRET}
