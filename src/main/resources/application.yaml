server:
  # Behind a reverse proxy the application otherwise takes the proxy for the client. Measured on a
  # live deployment: every caller in the world, on any continent, charged to a single 172.18.0.1 —
  # which turns every per-IP rate limit into a limit on the whole application at once, and lets five
  # requests a minute keep everybody from logging in. NATIVE has Tomcat rewrite the remote address
  # from X-Forwarded-For before any of our code runs, and only for a peer inside the private ranges,
  # so a request that reaches the application directly cannot forge one.
  forward-headers-strategy: NATIVE

spring:
  application:
    name: nido
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      url: ${NIDO_REDIS_URL:redis://localhost:6379}

  datasource:
    url: ${NIDO_DB_URL}
    username: ${NIDO_DB_USER}
    password: ${NIDO_DB_PASSWORD}
  jpa:
    # Off deliberately. Left on, the Hibernate session stays open through response rendering,
    # holding a connection from the pool for the whole write-out. Nothing here needs it: there
    # is not a single JPA relation in the codebase, so no lazy proxy can escape its transaction —
    # every aggregate is assembled by explicit queries inside a @Transactional handler and mapped
    # to domain records before it leaves.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    # Under /api deliberately. The session cookie is scoped to /api (see CookieService), so a
    # document served anywhere else can never be read by a logged-in browser — requiring
    # authentication on /v3/api-docs made Swagger unusable rather than private. Here the existing
    # /api/** rule authenticates it and the cookie actually arrives.
    path: /api/docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

NIDO:
  jwt:
    secret: ${NIDO_JWT_SECRET}
    expiry-minutes: ${NIDO_JWT_EXPIRY_MINUTES:15}
  refresh-token:
    expiry-days: ${NIDO_REFRESH_TOKEN_EXPIRY_DAYS:30}
    purge-cron: ${NIDO_REFRESH_TOKEN_PURGE_CRON:0 0 3 * * *}
  cookie:
    secure: ${NIDO_COOKIE_SECURE:true}
  seed:
    username: ${NIDO_SEED_USERNAME}
    email: ${NIDO_SEED_EMAIL}
    password: ${NIDO_SEED_PASSWORD}
  cors:
    allowed-origins: ${NIDO_CORS_ALLOWED_ORIGINS:}
  encryption:
    secret: ${NIDO_ENCRYPTION_SECRET}
