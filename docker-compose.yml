services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${NIDO_DB_USER}
      POSTGRES_PASSWORD: ${NIDO_DB_PASSWORD}
      POSTGRES_DB: nido
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NIDO_DB_USER} -d nido"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data: