services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${NIDO_DB_USER}
      POSTGRES_PASSWORD: ${NIDO_DB_PASSWORD}
      POSTGRES_DB: nido
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NIDO_DB_USER} -d nido"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every mail the app sends in development and shows it at http://localhost:8025, with an
  # "HTML Check" tab listing what each mail client would not render. Off by default:
  #   docker compose --profile mail up -d
  # then set NIDO_SMTP_HOST=localhost, NIDO_SMTP_PORT=1025, NIDO_SMTP_SECURITY=none (see .env.example).
  mailpit:
    image: axllent/mailpit:v1.31.3
    profiles: ["mail"]
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  redis_data: